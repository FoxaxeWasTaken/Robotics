# CI for every PR (none on main, #153): lint → project-rule guards → build + tests inside the project image.
# Details and rationale: docs/project/14_quality_pipeline_ci.md
name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]  # ready: a draft's pushes run the light jobs only

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true  # a new push replaces the PR's running CI

permissions:
  contents: read

# Dependabot PRs run like fork PRs: repository variables may not reach them, and a skipped required
# check counts as passed. Hence the jobs also run when Dependabot is the author, in this repository
# only: the school copy mirrors dependabot.yml and must run nothing (docs/project/16 §4).
# Billed minutes (#146): a draft PR or a docs-only change runs lint and guards only, decided in the lint job (a
# required check: a failed decision blocks the PR instead of skipping the tests).
# No run on main (#153): the ruleset merges a PR only up to date with main, by squash, so main gets the exact tree
# its CI tested. The mirror (mirror.yml) and the nightly (nightly.yml) still run on main.
jobs:
  lint:
    if: ${{ vars.CI_ENABLED == 'true' || (github.event.pull_request.user.login == 'dependabot[bot]' && github.repository == 'FoxaxeWasTaken/Robotics') }}   # opt-in: nothing runs on the school mirror
    name: Lint (pre-commit)
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: read  # the PR's draft state when the run executes (#209)
    outputs:
      heavy: ${{ steps.changes.outputs.heavy }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0          # gitleaks scans the whole history
      - name: Build, tests and E2E needed? (not for a draft or a docs-only change)
        id: changes
        env:
          DRAFT_EVENT: ${{ github.event.pull_request.draft }}
          PR: ${{ github.event.pull_request.number }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$GITHUB_EVENT_NAME" != pull_request ]; then
            echo heavy=true | tee -a "$GITHUB_OUTPUT"
            exit 0
          fi
          # The draft state now, not the event's (#209): a failed lookup leaves it empty, and heavy.sh runs everything.
          draft=$(gh pr view "$PR" -R "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft) || draft=""
          echo "Draft when the event fired: $DRAFT_EVENT; now: ${draft:-unknown}"
          # The PR's merge commit against its base, renames as delete + add: code moved into a .md still counts.
          git diff --name-only --no-renames HEAD^1 HEAD | bash tools/ci/heavy.sh "$draft" | tee -a "$GITHUB_OUTPUT"
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ hashFiles('.pre-commit-config.yaml') }}
      - run: pip install pre-commit
      - run: pre-commit run --all-files --show-diff-on-failure
      - name: Secrets in the whole history (gitleaks)
        # detect-private-key only sees private keys; GitHub secret scanning needs a paid plan on a private repo.
        run: docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.30.1 git /repo --redact --verbose

  guards:
    if: ${{ vars.CI_ENABLED == 'true' || (github.event.pull_request.user.login == 'dependabot[bot]' && github.repository == 'FoxaxeWasTaken/Robotics') }}   # opt-in: nothing runs on the school mirror
    name: Project rules (C-05, C-06, C-23)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: bash tools/ci/guards.sh

  control:
    if: ${{ needs.lint.outputs.heavy == 'true' && (vars.CI_ENABLED == 'true' || (github.event.pull_request.user.login == 'dependabot[bot]' && github.repository == 'FoxaxeWasTaken/Robotics')) }}   # opt-in: nothing runs on the school mirror
    name: Build + tests (control image)
    runs-on: ubuntu-24.04
    needs: [lint, guards]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build tek5/control (GitHub Actions cache)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/Dockerfile.control
          tags: tek5/control:ci
          load: true
          cache-from: type=gha,scope=control
          cache-to: type=gha,mode=max,scope=control
      - name: colcon build + test (sim headless, OSMesa)
        run: |
          docker run --rm -e MUJOCO_GL=osmesa -v "$PWD/ros2_ws:/ros2_ws" tek5/control:ci bash -lc '
            source /opt/ros/jazzy/setup.bash && cd /ros2_ws &&
            colcon build --symlink-install --event-handlers console_cohesion+ &&
            ament_xmllint src/*/package.xml &&   # package.xml against the ROS schema (check-xml only checks syntax)
            # Only packages with a test/ folder: since Python 3.12 an empty package fails ("NO TESTS RAN").
            # so101_perception: built here for the sim tests of so101_bringup (#45), tested in its own image.
            pkgs=$(ls -d src/*/test 2>/dev/null | cut -d/ -f2 | grep -vx so101_perception) &&
            if [ -z "$pkgs" ]; then echo "No test folder yet: nothing to test."; else
              # One package at a time: run in parallel, the brain IK property tests starved the camera of the
              # driver launch test on the 4-vCPU runner (2.7 Hz). The rate tests need the CPU.
              colcon test --executor sequential --packages-select $pkgs --pytest-with-coverage --event-handlers console_cohesion+ &&
              colcon test-result --verbose; fi'
      - name: Coverage data with repository-relative paths (for the PR comment)
        run: |
          docker run --rm -v "$PWD:/repo" -w /repo tek5/control:ci bash -lc '
            set -- ros2_ws/build/*/.coverage
            if [ ! -e "$1" ]; then echo "No coverage data."; exit 0; fi
            python3 -m coverage combine --keep --data-file=.coverage "$@" && python3 -m coverage report'
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage
          path: .coverage
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 3
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: test-results-control
          path: ros2_ws/build/*/pytest.xml
          if-no-files-found: ignore

  coverage:
    # Comments the coverage of the PR on the PR (non-blocking, not a required check). Same-repository
    # PRs only: fork and Dependabot PRs get a read-only token. The only job allowed to write (a comment).
    if: >-
      ${{ vars.CI_ENABLED == 'true' && github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.login != 'dependabot[bot]' }}
    name: Coverage comment
    runs-on: ubuntu-24.04
    needs: control
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: coverage
      - uses: py-cov-action/python-coverage-comment-action@e5fb2218463c3377f3504b0c5b5646ed53da7a2f # v4.5
        with:
          GITHUB_TOKEN: ${{ github.token }}
          MINIMUM_GREEN: 80
          MINIMUM_ORANGE: 60

  perception:
    if: ${{ needs.lint.outputs.heavy == 'true' && (vars.CI_ENABLED == 'true' || (github.event.pull_request.user.login == 'dependabot[bot]' && github.repository == 'FoxaxeWasTaken/Robotics')) }}   # opt-in: nothing runs on the school mirror
    name: Build + tests (perception image)
    runs-on: ubuntu-24.04
    needs: [lint, guards]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/Dockerfile.perception
          tags: tek5/perception:ci
          load: true
          cache-from: type=gha,scope=perception
          cache-to: type=gha,mode=max,scope=perception
      - name: colcon build + test (perception packages)
        # The provided package carries a COLCON_IGNORE until the team activates it (step 3.1).
        if: ${{ hashFiles('ros2_ws/src/so101_perception/COLCON_IGNORE') == '' }}
        run: |
          docker run --rm -v "$PWD/ros2_ws:/ros2_ws" tek5/perception:ci bash -lc '
            source /opt/ros/jazzy/setup.bash && cd /ros2_ws &&
            colcon build --build-base build_perception --install-base install_perception --packages-up-to so101_perception so101_connect4 &&
            colcon test --build-base build_perception --install-base install_perception --packages-select so101_perception so101_connect4 &&
            colcon test-result --test-result-base build_perception --verbose'

  e2e-smoke:
    name: E2E sim (3 episodes)
    # Enabled on 2026-10-23, after #139: Settings → Variables → E2E_ENABLED = true.
    if: ${{ github.event_name == 'pull_request' && vars.CI_ENABLED == 'true' && vars.E2E_ENABLED == 'true' }}
    runs-on: ubuntu-24.04
    needs: [control, perception]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build images
        run: docker compose -f docker/docker-compose.yml build
      - name: Evaluation bench (N=3)
        env:
          EXPOSE_GROUND_TRUTH: "true"  # the bench scores with the ground truth; the pipeline never reads it (C-06)
        run: |
          cp docker/.env.example docker/.env
          docker compose -f docker/docker-compose.yml up -d control perception viz
          bash tools/ci/wait_for_stack.sh
          docker compose -f docker/docker-compose.yml exec -T control bash -lc '
            source /ros2_ws/install/setup.bash && ros2 run so101_bringup evaluate --episodes 3 --min-success 3 --out /ros2_ws/eval.csv'
      - name: Stack state and logs (on failure)
        if: failure()
        run: |
          docker compose -f docker/docker-compose.yml ps -a
          docker compose -f docker/docker-compose.yml logs --tail 150 control perception
          # which link is dead: the nodes a fresh process finds, then the driver's and the brain's topic
          docker compose -f docker/docker-compose.yml exec -T control bash -lc '
            source /ros2_ws/install/setup.bash && ros2 node list --no-daemon --spin-time 3
            for t in "/joint_states sensor_msgs/msg/JointState" "/end_effector_pose geometry_msgs/msg/PoseStamped"; do
              timeout 10 ros2 topic echo --once $t >/dev/null && echo "${t%% *}: received" || echo "${t%% *}: nothing in 10 s"
            done'
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: e2e-smoke
          path: ros2_ws/eval.csv
          if-no-files-found: ignore

  e2e-game:
    # Phase 2 (#233): one Connect Four game on the compose stack in game mode, scored with the ground truth.
    # Not a required check until its runs have been green for a few days; its name must not change after that.
    name: E2E sim (1 game)
    if: ${{ github.event_name == 'pull_request' && vars.CI_ENABLED == 'true' && vars.E2E_ENABLED == 'true' }}
    runs-on: ubuntu-24.04
    needs: [control, perception]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build images
        run: docker compose -f docker/docker-compose.yml build
      - name: Game bench (N=1, a random player)
        env:
          CONNECT4: "true"  # the game in place of the pick & place: the stack, and what wait_for_stack.sh waits for
          EXPOSE_GROUND_TRUTH: "true"  # the bench scores with the ground truth; the pipeline never reads it (C-06)
        run: |
          cp docker/.env.example docker/.env
          docker compose -f docker/docker-compose.yml up -d control perception viz
          bash tools/ci/wait_for_stack.sh
          docker compose -f docker/docker-compose.yml exec -T control bash -lc '
            source /ros2_ws/install/setup.bash && ros2 run so101_bringup evaluate --games 1 --min-success 1 --out /ros2_ws/eval_games.csv'
      - name: Stack state and logs (on failure)
        if: failure()
        run: |
          docker compose -f docker/docker-compose.yml ps -a
          docker compose -f docker/docker-compose.yml logs --tail 150 control perception
          # the game as its node last saw it, and the grid as the camera and the sim have it
          docker compose -f docker/docker-compose.yml exec -T control bash -lc '
            source /ros2_ws/install/setup.bash && ros2 node list --no-daemon --spin-time 3
            for t in "/connect4/state std_msgs/msg/String" "/connect4/board so101_interfaces/msg/Connect4Board" "/sim/ground_truth/connect4_board so101_interfaces/msg/Connect4Board"; do
              timeout 10 ros2 topic echo --once $t || echo "${t%% *}: nothing in 10 s"
            done'
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: e2e-game
          path: ros2_ws/eval_games.csv
          if-no-files-found: ignore
