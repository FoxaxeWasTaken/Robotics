# CI for every PR and main: lint → project-rule guards → build + tests inside the project image.
# Details and rationale: docs/project/14_quality_pipeline_ci.md
name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}   # never cancel a run on main

permissions:
  contents: read

# Dependabot PRs run like fork PRs: repository variables may not reach them, and a skipped required
# check counts as passed. Hence the jobs also run when Dependabot is the author, in this repository
# only: the school copy mirrors dependabot.yml and must run nothing (docs/project/16 §4).
jobs:
  lint:
    if: ${{ vars.CI_ENABLED == 'true' || (github.event.pull_request.user.login == 'dependabot[bot]' && github.repository == 'FoxaxeWasTaken/Robotics') }}   # opt-in: nothing runs on the school mirror
    name: Lint (pre-commit)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0          # gitleaks scans the whole history
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ hashFiles('.pre-commit-config.yaml') }}
      - run: pip install pre-commit
      - run: pre-commit run --all-files --show-diff-on-failure
      - name: Secrets in the whole history (gitleaks)
        # detect-private-key only sees private keys; GitHub secret scanning needs a paid plan on a private repo.
        run: docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.30.1 git /repo --redact --verbose

  guards:
    if: ${{ vars.CI_ENABLED == 'true' || (github.event.pull_request.user.login == 'dependabot[bot]' && github.repository == 'FoxaxeWasTaken/Robotics') }}   # opt-in: nothing runs on the school mirror
    name: Project rules (C-05, C-06, C-23)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: bash tools/ci/guards.sh

  control:
    if: ${{ vars.CI_ENABLED == 'true' || (github.event.pull_request.user.login == 'dependabot[bot]' && github.repository == 'FoxaxeWasTaken/Robotics') }}   # opt-in: nothing runs on the school mirror
    name: Build + tests (control image)
    runs-on: ubuntu-24.04
    needs: [lint, guards]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build tek5/control (GitHub Actions cache)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/Dockerfile.control
          tags: tek5/control:ci
          load: true
          cache-from: type=gha,scope=control
          cache-to: type=gha,mode=max,scope=control
      - name: colcon build + test (sim headless, OSMesa)
        run: |
          docker run --rm -e MUJOCO_GL=osmesa -v "$PWD/ros2_ws:/ros2_ws" tek5/control:ci bash -lc '
            source /opt/ros/jazzy/setup.bash && cd /ros2_ws &&
            colcon build --symlink-install --packages-skip so101_perception --event-handlers console_cohesion+ &&
            ament_xmllint src/*/package.xml &&   # package.xml against the ROS schema (check-xml only checks syntax)
            # Only packages with a test/ folder: since Python 3.12 an empty package fails ("NO TESTS RAN").
            pkgs=$(ls -d src/*/test 2>/dev/null | cut -d/ -f2) &&
            if [ -z "$pkgs" ]; then echo "No test folder yet: nothing to test."; else
              colcon test --packages-select $pkgs --pytest-with-coverage --event-handlers console_cohesion+ &&
              colcon test-result --verbose; fi'
      - name: Coverage data with repository-relative paths (for the PR comment)
        run: |
          docker run --rm -v "$PWD:/repo" -w /repo tek5/control:ci bash -lc '
            set -- ros2_ws/build/*/.coverage
            if [ ! -e "$1" ]; then echo "No coverage data."; exit 0; fi
            python3 -m coverage combine --keep --data-file=.coverage "$@" && python3 -m coverage report'
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage
          path: .coverage
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 3
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: test-results-control
          path: ros2_ws/build/*/pytest.xml
          if-no-files-found: ignore

  coverage:
    # Comments the coverage of the PR on the PR (non-blocking, not a required check). Same-repository
    # PRs only: fork and Dependabot PRs get a read-only token. The only job allowed to write (a comment).
    if: >-
      ${{ vars.CI_ENABLED == 'true' && github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.login != 'dependabot[bot]' }}
    name: Coverage comment
    runs-on: ubuntu-24.04
    needs: control
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: coverage
      - uses: py-cov-action/python-coverage-comment-action@e5fb2218463c3377f3504b0c5b5646ed53da7a2f # v4.5
        with:
          GITHUB_TOKEN: ${{ github.token }}
          MINIMUM_GREEN: 80
          MINIMUM_ORANGE: 60

  perception:
    if: ${{ vars.CI_ENABLED == 'true' || (github.event.pull_request.user.login == 'dependabot[bot]' && github.repository == 'FoxaxeWasTaken/Robotics') }}   # opt-in: nothing runs on the school mirror
    name: Build + tests (perception image)
    runs-on: ubuntu-24.04
    needs: [lint, guards]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/Dockerfile.perception
          tags: tek5/perception:ci
          load: true
          cache-from: type=gha,scope=perception
          cache-to: type=gha,mode=max,scope=perception
      - name: colcon build + test (perception packages)
        # The provided package carries a COLCON_IGNORE until the team activates it (step 3.1).
        if: ${{ hashFiles('ros2_ws/src/so101_perception/COLCON_IGNORE') == '' }}
        run: |
          docker run --rm -v "$PWD/ros2_ws:/ros2_ws" tek5/perception:ci bash -lc '
            source /opt/ros/jazzy/setup.bash && cd /ros2_ws &&
            colcon build --build-base build_perception --install-base install_perception --packages-up-to so101_perception &&
            colcon test --build-base build_perception --install-base install_perception --packages-select so101_perception &&
            colcon test-result --test-result-base build_perception --verbose'

  e2e-smoke:
    name: E2E sim (3 episodes)
    # Enable at roadmap step 4.5: Settings → Variables → E2E_ENABLED = true
    if: ${{ vars.CI_ENABLED == 'true' && vars.E2E_ENABLED == 'true' }}
    runs-on: ubuntu-24.04
    needs: [control, perception]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build images
        run: docker compose -f docker/docker-compose.yml build
      - name: Evaluation bench (N=3)
        run: |
          cp docker/.env.example docker/.env
          docker compose -f docker/docker-compose.yml up -d control perception viz
          docker compose -f docker/docker-compose.yml exec -T control bash -lc '
            source /ros2_ws/install/setup.bash && ros2 run so101_bringup evaluate --episodes 3 --out /ros2_ws/eval.csv'
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: e2e-smoke
          path: ros2_ws/eval.csv
          if-no-files-found: ignore
