# Long-running jobs, off the PR path: full evaluation bench, documentation checks, course repository watch.
name: Nightly

on:
  schedule:
    - cron: "0 3 * * *"     # 03:00 UTC
  workflow_dispatch:
    inputs:
      episodes:
        description: Number of evaluation episodes
        default: "50"

permissions:
  contents: read

jobs:
  docs:
    name: Documentation (diagrams + links)
    if: ${{ vars.CI_ENABLED == 'true' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Render every Mermaid diagram
        run: bash tools/ci/check_mermaid.sh
      - name: External links
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: --no-progress --exclude-path core --exclude-path sim "./**/*.md"
          fail: true

  upstream:
    name: Course repository watch
    if: ${{ vars.CI_ENABLED == 'true' }}  # never on the school mirror (ADR-033)
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      issues: write  # opens or updates one issue; it cannot push
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: New course commits, one issue (docs/project/15 §2)
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: bash tools/ci/upstream_check.sh

  main-changed:
    name: Bench due? (main changed since the last one)
    if: ${{ vars.CI_ENABLED == 'true' && vars.E2E_ENABLED == 'true' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read  # the previous nightly runs and their jobs
    outputs:
      evaluate: ${{ steps.due.outputs.evaluate }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: due
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then echo "evaluate=true"; else
            bash tools/ci/evaluation_due.sh "$SHA"; fi | tee -a "$GITHUB_OUTPUT"

  evaluation:
    name: Full evaluation bench  # evaluation_due.sh finds the previous benches by this name
    needs: main-changed
    # Skipped only on an explicit "false" (#146): if the check itself fails, the bench runs.
    if: >-
      ${{ !cancelled() && needs.main-changed.outputs.evaluate != 'false' &&
      vars.CI_ENABLED == 'true' && vars.E2E_ENABLED == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: read
      issues: write  # the report: one comment per bench on "Nightly bench results" (#151); it cannot push
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: docker compose -f docker/docker-compose.yml build
      - name: Bench (randomized cube + box)
        env:
          EPISODES: ${{ inputs.episodes || '50' }}
          EXPOSE_GROUND_TRUTH: "true"  # the bench scores with the ground truth; the pipeline never reads it (C-06)
          FASTDDS_BUILTIN_TRANSPORTS: DEFAULT  # as the control tests: LARGE_DATA lost nodes at the start (#141)
        run: |
          set -o pipefail  # the bench's status, not tee's
          cp docker/.env.example docker/.env
          docker compose -f docker/docker-compose.yml up -d control perception viz
          bash tools/ci/wait_for_stack.sh
          docker compose -f docker/docker-compose.yml exec -T -e EPISODES control bash -lc '
            source /ros2_ws/install/setup.bash &&
            ros2 run so101_bringup evaluate --episodes "$EPISODES" --out /ros2_ws/eval.csv --bags /ros2_ws/bags' |
            tee "$RUNNER_TEMP/bench.log"
      - name: Report (run summary, issue "Nightly bench results")
        if: always()  # a bench that stopped, or never started, is reported too
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          REF: ${{ github.ref_name }}  # main, or the branch of a workflow_dispatch
          SHA: ${{ github.sha }}
          EPISODES: ${{ inputs.episodes || '50' }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          ARTIFACT: evaluation-${{ github.run_number }}
        run: |
          touch "$RUNNER_TEMP/bench.log"  # the bench never started: an empty log, "did not finish"
          bash tools/ci/bench_report.sh "$RUNNER_TEMP/bench.log"
      - name: Stack state and logs (on failure)
        if: failure()
        run: |
          docker compose -f docker/docker-compose.yml ps -a
          docker compose -f docker/docker-compose.yml logs --tail 150 control perception
          # which link is dead: the nodes a fresh process finds, then the driver's and the brain's topic
          docker compose -f docker/docker-compose.yml exec -T control bash -lc '
            source /ros2_ws/install/setup.bash && ros2 node list --no-daemon --spin-time 3
            for t in "/joint_states sensor_msgs/msg/JointState" "/end_effector_pose geometry_msgs/msg/PoseStamped"; do
              timeout 10 ros2 topic echo --once $t >/dev/null && echo "${t%% *}: received" || echo "${t%% *}: nothing in 10 s"
            done'
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: evaluation-${{ github.run_number }}
          path: |
            ros2_ws/eval.csv
            ros2_ws/bags/
          retention-days: 14

  quality:
    # Trends (#60): CI runners are too noisy for a pass/fail gate, so the values are only recorded. SonarQube
    # Cloud (#61): analyses of main only (no CI on main since #153), not a required check (14 §4).
    name: Quality trends and SonarQube Cloud
    needs: main-changed
    if: >-
      ${{ !cancelled() && needs.main-changed.outputs.evaluate != 'false' &&
      vars.CI_ENABLED == 'true' && vars.E2E_ENABLED == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0  # SonarQube Cloud: blame and new-code detection
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build tek5/control (GitHub Actions cache)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/Dockerfile.control
          tags: tek5/control:ci
          load: true
          cache-from: type=gha,scope=control
          cache-to: type=gha,mode=max,scope=control
      - name: Every package's tests with coverage, then the trends
        run: |
          docker run --rm -e MUJOCO_GL=osmesa -v "$PWD/ros2_ws:/ros2_ws" tek5/control:ci bash -lc '
            source /opt/ros/jazzy/setup.bash && cd /ros2_ws &&
            colcon build --symlink-install --event-handlers console_cohesion+ &&
            colcon test --executor sequential --packages-select $(ls -d src/*/test | cut -d/ -f2) \
              --pytest-with-coverage --event-handlers console_cohesion+ ; colcon test-result --verbose
            source install/setup.bash && mkdir -p trends &&
            python3 -m pytest -q -p no:cacheprovider src/so101_brain/test/test_benchmark.py --benchmark-json=trends/ik.json &&
            python3 -m pytest -q -s -p no:cacheprovider src/so101_driver/test/test_driver_launch.py |
              tee trends/control.log'
      - name: Coverage XML and trends.csv
        env:
          SHA: ${{ github.sha }}
        run: |
          docker run --rm -e SHA -v "$PWD:/repo" -w /repo tek5/control:ci bash -lc '
            python3 -m coverage combine --keep --data-file=.coverage ros2_ws/build/*/.coverage &&
            python3 -m coverage xml -o coverage.xml &&
            python3 tools/ci/trends.py ros2_ws/trends/ik.json ros2_ws/trends/control.log "$SHA" trends.csv'
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: trends-${{ github.run_number }}
          path: trends.csv
          retention-days: 90
      - name: SonarQube Cloud analysis (sonar-project.properties)
        uses: SonarSource/sonarqube-scan-action@d209202bc7d53ff1cc128f7f907dac145c9d6ae9 # v8.3.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
