# Squash merge turns the PR title into the commit message on main: it must be a conventional commit
# (same types as the local commit-msg hook in .pre-commit-config.yaml). Details: docs/project/14 §5.
name: PR title

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions: {}

jobs:
  title:
    if: ${{ vars.CI_ENABLED == 'true' }}
    name: PR title (conventional commit)
    runs-on: ubuntu-24.04
    steps:
      - name: Check the title
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          re='^(feat|fix|docs|test|refactor|perf|build|ci|chore|revert)(\([a-z0-9._/-]+\))?!?: .+'
          if [[ "$TITLE" =~ $re ]]; then
            echo "OK: $TITLE"
          else
            echo "::error::Not a conventional commit title, expected 'type(scope): description': $TITLE"
            exit 1
          fi
