# Mirror of the private repo (CI, PRs) to the school repo (submission).
# Force-pushes main and the tags: the school repo is an exact copy, nobody pushes there. Details: docs/project/16_mirroring_school_repo.md
# The key lives in the "school-mirror" environment, restricted to main: only reviewed code can read it.
# No tag trigger (a tag can point at unreviewed code): tags go with the next main push or a manual run.
# Every other branch of the school repo is deleted, which closes its PR (#216): nothing lives there. Daily too, so a
# Dependabot PR opened there between two merges does not wait for the next one.
name: Mirror

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 3 * * *"  # 03:17 UTC, after the nightly starts (03:00): a day with no push still mirrors
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mirror
  cancel-in-progress: false

jobs:
  mirror:
    name: Mirror to the school repo
    # The variable only exists on the private repo: the job never runs on the mirror itself.
    if: ${{ vars.SCHOOL_REPO_SSH_URL != '' }}
    runs-on: ubuntu-24.04
    environment: school-mirror
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: SSH key for the school repo
        env:
          SSH_KEY: ${{ secrets.SCHOOL_DEPLOY_KEY }}
          GIT_HOST: ${{ vars.SCHOOL_GIT_HOST || 'github.com' }}
          SCHOOL_URL: ${{ vars.SCHOOL_REPO_SSH_URL }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -t ed25519 "$GIT_HOST" >> ~/.ssh/known_hosts
          git remote add school "$SCHOOL_URL"
      - name: Push main (forced, exact copy)
        if: ${{ github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch' }}  # a schedule runs on main
        run: git push --force school origin/main:refs/heads/main
      - name: Push tags (forced)
        run: git push --force school --tags
      - name: Only main and the tags on the school repo (its other branches deleted, their PRs closed)
        run: bash tools/ci/prune_school.sh school
