# Mirror of the private repo (CI, PRs) to the school repo (submission).
# Pushes main and v* tags, never with force. Details: docs/project/16_mirroring_school_repo.md
# The key lives in the "school-mirror" environment, restricted to main: only reviewed code can read it.
# No tag trigger (a tag can point at unreviewed code): tags go with the next main push or a manual run.
name: Mirror

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mirror
  cancel-in-progress: false

jobs:
  mirror:
    name: Mirror to the school repo
    # The variable only exists on the private repo: the job never runs on the mirror itself.
    if: ${{ vars.SCHOOL_REPO_SSH_URL != '' }}
    runs-on: ubuntu-24.04
    environment: school-mirror
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: SSH key for the school repo
        env:
          SSH_KEY: ${{ secrets.SCHOOL_DEPLOY_KEY }}
          GIT_HOST: ${{ vars.SCHOOL_GIT_HOST || 'github.com' }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -t ed25519 "$GIT_HOST" >> ~/.ssh/known_hosts
          git remote add school "${{ vars.SCHOOL_REPO_SSH_URL }}"
      - name: Push main (fast-forward only)
        if: ${{ github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch' }}
        run: git push school origin/main:refs/heads/main
      - name: Push tags
        run: git push school --tags
