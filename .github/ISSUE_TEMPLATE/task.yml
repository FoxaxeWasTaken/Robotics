name: Task / roadmap ticket
description: One PR-sized ticket of a roadmap step (docs/project/09). Anatomy and Definition of Ready in CONTRIBUTING §8.
labels: [task]
body:
  - type: markdown
    attributes:
      value: |
        Write it so that **a teammate or an AI agent can do it without asking you**: exact files, checkable criteria, what not to touch.
        Lane, priority and size are set on the GitHub Project, the parent epic and *blocked by* under **Relationships**.
  - type: input
    id: step
    attributes:
      label: Roadmap step
      placeholder: "1.3 — camera_info, effort, frames"
    validations:
      required: true
  - type: textarea
    id: goal
    attributes:
      label: Goal
      description: Why this ticket exists, in one or two sentences (the problem, not the solution).
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Scope
      description: What to do, as a checklist.
      placeholder: "- [ ] Publish CameraInfo with the image stamp\n- [ ] Component test"
    validations:
      required: true
  - type: textarea
    id: out_of_scope
    attributes:
      label: Out of scope
      description: What must not be done here (and which ticket does it).
  - type: textarea
    id: done
    attributes:
      label: Done when
      description: Only checkable facts — a command, a test, a measured threshold.
      placeholder: "- [ ] ros2 topic hz /joint_states ≥ 20 Hz\n- [ ] test_x green in CI"
    validations:
      required: true
  - type: textarea
    id: files
    attributes:
      label: Files and interfaces
      description: Paths to create or modify; topics, services or parameters touched (interface contract docs/project/01 §3).
  - type: textarea
    id: references
    attributes:
      label: References
      description: Doc sections, ADRs, requirements (C-xx), measurements (MES-xx).
      placeholder: "docs/project/03 §6, ADR-007, C-13"
  - type: textarea
    id: review
    attributes:
      label: Review focus
      description: What the reviewer must check first (expert role of docs/project/README.md, e.g. [SAFE]).
