# Real-arm values of so101_driver (docs/project/01 §3.3, 07 §2), loaded on top of driver.yaml when use_sim is
# false (real.launch.py). Only keys of driver.yaml, each with another value (test_real_config.py).
so101_driver:
  ros__parameters:
    max_joint_velocity: 0.8     # rad/s (ADR-023)
    camera_device: /dev/video0  # the webcam, MJPG (02 §5.2); no camera: the arm works without images
    camera_width: 640
    camera_height: 480
    camera_info_file: /ros2_ws/src/so101_bringup/config/camera_real_intrinsics.yaml  # calibrate_intrinsics (6.2b)
    # rad, ARM_JOINT_NAMES order: each joint's reading at the URDF zero (arm stretched, horizontal), with the
    # calibration of 2026-11-06 14:56; one placement by hand, to measure again on recalibration (#196, 07 §4)
    joint_zero_offsets: [-0.103, 0.002, 0.186, -0.027, -0.002]
