# Loaded on top of driver.yaml with connect4:=true (sim.launch.py): the image size the board reader needs to
# find the grid's markers and read its 42 cells [MES-65] (phase2/P2-02 §3), and where the arm ends its day.
so101_driver:
  ros__parameters:
    camera_width: 640
    camera_height: 480
    # The brain's HANDOVER (brain.yaml), not PARK: from HANDOVER the joint line to PARK takes the gripper
    # 30 mm into the grid's near post; from above any column, the way to HANDOVER stays 11 mm clear [MES-69].
    shutdown_pose: [-1.0, -0.6, 0.6, 1.1, 1.57]
