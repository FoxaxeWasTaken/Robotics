# Real-arm values of so101_brain (docs/project/01 §3.3, 06 §5), loaded on top of brain.yaml when use_sim is false
# (real.launch.py). Only keys of brain.yaml, each with another value (test_real_config.py).
so101_brain:
  ros__parameters:
    motion:
      reach_tol_rad: 0.10  # P = 16: the real arm stops up to 0.08 rad off under gravity (07 §4), 0.01 never ends
      reach_tol_roll_rad: 0.25  # its wrist_roll stops up to 0.17 rad off; the TCP does not care
    fsm:
      grasp_wait_s: 1.2     # the real jaws close slower than the sim's: judged once they stopped
      grasp_timeout_s: 2.0
    grasp:
      close_pct: 1.0     # jaws on the cube stop at 4.5 %; 0 % trips Overload (MES-56)
      hold_gap_pct: 1.8  # held from 2.8 %: 2.6 % empty at close_pct 2, about 1.6 % at 1
