[develop]
script_dir=$base/lib/so101_brain
[install]
install_scripts=$base/lib/so101_brain
[mutmut]
# Mutation testing of the state machine (docs/project/08 §1, MES-42) and of the game's move (MES-74): run
# from this folder. test_drop.py needs so101_description's URDF: built first (08 §1).
source_paths =
    so101_brain/fsm.py
    so101_brain/drop.py
also_copy =
    so101_brain/__init__.py
    so101_brain/trajectory.py
    so101_brain/grasp_planner.py
    so101_brain/kinematics.py
pytest_add_cli_args_test_selection =
    test/test_fsm.py
    test/test_drop.py
pytest_add_cli_args = -p no:cacheprovider
