[develop]
script_dir=$base/lib/so101_brain
[install]
install_scripts=$base/lib/so101_brain
[mutmut]
# Mutation testing of the state machine (docs/project/08 §1, MES-42), of the game's move (MES-74) and of what
# judges it against the measured grid (MES-78): run from this folder. test_drop.py and test_clearance.py need
# so101_description's URDF: built first (08 §1).
source_paths =
    so101_brain/fsm.py
    so101_brain/drop.py
    so101_brain/clearance.py
also_copy =
    so101_brain/__init__.py
    so101_brain/trajectory.py
    so101_brain/grasp_planner.py
    so101_brain/kinematics.py
    so101_brain/hulls.py
pytest_add_cli_args_test_selection =
    test/test_fsm.py
    test/test_drop.py
    test/test_clearance.py
pytest_add_cli_args = -p no:cacheprovider
