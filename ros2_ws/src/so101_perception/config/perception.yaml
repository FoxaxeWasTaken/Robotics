# ROS parameters of so101_perception (docs/project/05), read at startup.
so101_perception:
  ros__parameters:
    process_rate_hz: 20.0  # checks for a new image; above the camera's 10 Hz, each image is processed once
    # HSV thresholds (05 §2.2; OpenCV: H in [0, 180], S, V in [0, 255]), tunable at runtime with ros2 param set.
    # A hue interval wraps around 180 when h_min > h_max: the red cube is [160, 180] U [0, 8].
    hsv_cube_h_min: 160
    hsv_cube_h_max: 8
    hsv_cube_s_min: 150   # the cube S >= 205, the floor <= 106 under the dim light (#175, MES-52)
    hsv_cube_v_min: 30    # its shaded side under the dim light (#175, MES-52)
    hsv_box_h_min: 5
    hsv_box_h_max: 25
    hsv_box_s_min: 140    # the box S >= 164, the dim floor and arm <= 113 (#175, MES-52)
    hsv_box_v_min: 20     # the box V 24 under the dim light
    hsv_box_v_max: 220
    min_area_px: 15.0  # blob guards (05 §2.3)
    min_solidity: 0.6
    cube_side_m: 0.05     # the object (05 §2.3): its size sets its center's height and its silhouette
    box_height_m: 0.05    # the drop target: read at mid-height (ADR-012)
    filter_size: 5        # median filter window; a jump must also persist this many times (05 §7)
    filter_jump_m: 0.02   # a detection this far from the median is a jump
    # Cube blob pixels / the smallest silhouette of a whole cube at its point, below which it is partly hidden
    # and not published (05 §6, #167): whole cubes 0.92-1.1 over 300 scenes, MES-53.
    min_cube_area_ratio: 0.85
    # extrinsics_file: config/camera_extrinsics.yaml of the package share, by default (05 §5.1)
