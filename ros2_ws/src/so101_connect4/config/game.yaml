# ROS parameters of game_node (docs/project/phase2/P2-02 §4, §5). Read at startup, but engine.max_depth.
game_node:
  ros__parameters:
    read_timeout_s: 5.0    # READ_BOARD: a stable board needs 5 new images, 0.5 s at 10 Hz; then FIX_BOARD
    board_fresh_s: 1.0     # a read this recent, unchanged at that timeout, proves the robot's token is lost
    think_timeout_s: 5.0   # THINK: the engine's budget is 1 s; then ERROR
    move_timeout_s: 90.0   # MOVE: a move lasts 12 to 17 s on the sim [MES-73]; then /brain/stop and ERROR
    engine:
      max_depth: 10        # the level: easy 1, medium 4, hard 10 [MES-70]; `ros2 param set` changes it in a game
      budget_s: 1.0        # a search stops there, at the last depth it completed
      seed: 0              # between two equal moves as central: with the depth, it replays a game
