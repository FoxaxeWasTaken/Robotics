[develop]
script_dir=$base/lib/so101_connect4
[install]
install_scripts=$base/lib/so101_connect4
[mutmut]
# Mutation testing of the game's turns, which decide when the arm moves (docs/project/08 §1, MES-74), and of
# what decides whether a game can start where the grid stands (MES-78): run from this folder.
source_paths =
    so101_connect4/turns.py
    so101_connect4/placement.py
also_copy =
    so101_connect4/__init__.py
    so101_connect4/game.py
    so101_connect4/board.py
    so101_connect4/layout.py
    config
pytest_add_cli_args_test_selection =
    test/test_turns.py
    test/test_placement.py
pytest_add_cli_args = -p no:cacheprovider
