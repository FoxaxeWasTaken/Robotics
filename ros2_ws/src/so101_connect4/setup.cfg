[develop]
script_dir=$base/lib/so101_connect4
[install]
install_scripts=$base/lib/so101_connect4
[mutmut]
# Mutation testing of the game's turns, which decide when the arm moves (docs/project/08 §1, MES-74): run
# from this folder.
source_paths = so101_connect4/turns.py
also_copy =
    so101_connect4/__init__.py
    so101_connect4/game.py
pytest_add_cli_args_test_selection = test/test_turns.py
pytest_add_cli_args = -p no:cacheprovider
