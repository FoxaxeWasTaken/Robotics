# Rules tuned for technical docs with tables and Mermaid diagrams.
config:
  default: true
  MD013: false          # line length: tables are long by nature
  MD033: false          # inline HTML (<br/> in Mermaid labels)
  MD041: false          # first line must be a heading: false positives on templates
  MD024:
    siblings_only: true # identical headings allowed in different sections (ADRs)
ignores:
  - "docs/SUJET.md"       # project brief provided by the course
  - "core/**"
  - "sim/**"
  - "ros2_ws/build*/**"
  - "ros2_ws/install*/**"
  - "ros2_ws/log/**"
  - "ros2_ws/src/so101_description/**"
