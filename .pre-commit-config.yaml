# Install (once per clone):  pipx install pre-commit && pre-commit install --install-hooks -t pre-commit -t commit-msg
# Run on the whole repo:      pre-commit run --all-files
# Content provided by the course: excluded (we never modify it, see docs/project/15).
# docs/SUJET.md and the PDF slides are provided by the course (SUJET.md would raise 13 markdownlint issues).
# docs/project/ (our documentation) is still checked.
exclude: ^(core|sim|ros2_ws/src/so101_description)/|^docs/(SUJET\.md|[^/]*\.pdf)$
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        exclude: ^ros2_ws/\.gitignore$     # provided by the course, kept identical to upstream
      - id: end-of-file-fixer
        exclude: ^ros2_ws/\.gitignore$
      - id: mixed-line-ending
        args: [--fix=lf]
      - id: check-yaml
      - id: check-toml
      - id: check-xml
      - id: check-merge-conflict
      - id: check-executables-have-shebangs
        exclude: (^|/)__init__\.py$          # upstream ships __init__.py files with mode 755
      - id: check-added-large-files
        args: [--maxkb=1024]          # blocks rosbags, videos, PDFs; provided meshes are excluded
      - id: detect-private-key
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.10
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format
  - repo: https://github.com/DavidAnson/markdownlint-cli2
    rev: v0.23.3
    hooks:
      - id: markdownlint-cli2
  # Workflows, shell scripts, Dockerfiles (docs/project/14 §4).
  - repo: https://github.com/Mateusz-Grzelinski/actionlint-py
    rev: v1.7.12.25
    hooks:
      - id: actionlint
  - repo: https://github.com/zizmorcore/zizmor-pre-commit
    rev: v1.31.0
    hooks:
      - id: zizmor              # workflow security: pinned actions, token scope, template injection
  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.11.0.1
    hooks:
      - id: shellcheck
        args: [--severity=warning]    # info/style notes (sourced ROS setup files) are not errors
  - repo: https://github.com/AleksaC/hadolint-py
    rev: v2.15.1
    hooks:
      - id: hadolint                  # rules tuned in .hadolint.yaml
  - repo: local
    hooks:
      - id: upstream-check-test
        name: upstream_check.sh test (#137)
        entry: bash tools/ci/test_upstream_check.sh
        language: system
        files: ^tools/ci/(test_)?upstream_check\.sh$
        pass_filenames: false
      - id: ci-skips-test
        name: docs_only.sh and evaluation_due.sh test (#146)
        entry: bash tools/ci/test_ci_skips.sh
        language: system
        files: ^tools/ci/(docs_only|evaluation_due|test_ci_skips)\.sh$
        pass_filenames: false
      - id: so101-test
        name: tools/so101 dry-run test (#133)
        entry: bash tools/ci/test_so101.sh
        language: system
        files: ^tools/(so101|ci/test_so101\.sh)$
        pass_filenames: false
      - id: bench-report-test
        name: bench_report.sh test (#151)
        entry: bash tools/ci/test_bench_report.sh
        language: system
        files: ^tools/ci/(test_)?bench_report\.sh$
        pass_filenames: false
  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v4.4.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]
        args: [feat, fix, docs, test, refactor, perf, build, ci, chore, revert]
