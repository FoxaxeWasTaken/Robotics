# Launch:
#   xhost +local:docker            # once per session (X11 access)
#   cp .env.example .env           # once, then edit it (sim or real arm)
#   docker compose up -d control perception viz
#
# RViz runs INSIDE the control container (X11 forwarded), so on the internal
# DDS network - no need for --network host:
#   docker compose exec control bash -lc "source /ros2_ws/install/setup.bash && rviz2 -d /ros2_ws/install/so101_bringup/share/so101_bringup/rviz/so101.rviz"
#
# ROS_DOMAIN_ID (set in .env) isolates groups sharing a machine.

name: tek5

# Shared ROS environment for all services.
x-ros-env: &ros-env
  ROS_DOMAIN_ID: ${ROS_DOMAIN_ID:-69}
  # The E2E jobs set DEFAULT: under LARGE_DATA, a fresh process missed a node of the stack for 60 s on CI runners (#141)
  FASTDDS_BUILTIN_TRANSPORTS: ${FASTDDS_BUILTIN_TRANSPORTS:-LARGE_DATA}

services:
  control:
    build:
      context: ..
      dockerfile: docker/Dockerfile.control
    image: tek5/control
    init: true
    environment:
      <<: *ros-env
      USE_SIM: ${USE_SIM:-true}
      REAL_ROBOT_PORT: ${REAL_ROBOT_PORT:-/dev/ttyACM0}
      EXPOSE_GROUND_TRUTH: ${EXPOSE_GROUND_TRUTH:-false}  # evaluation bench only (C-06): set by the E2E jobs
      MUJOCO_GL: osmesa
      DISPLAY: ${DISPLAY}
      QT_QPA_PLATFORM: xcb        # robust X11 and XWayland
    device_cgroup_rules:  # usb serial (real arm) and video4linux (webcam); nodes made by the entrypoint
      - 'c 166:* rmw'
      - 'c 188:* rmw'
      - 'c 81:* rmw'
    volumes:
      - ../ros2_ws:/ros2_ws
      - ../sim:/opt/so101/sim
      - /tmp/.X11-unix:/tmp/.X11-unix
      - ./control_entrypoint.sh:/opt/so101/entrypoint.sh:ro
      - ${CALIBRATION_FILE:-/dev/null}:/calibration/arm.json:ro
    networks: [rosnet]
    stdin_open: true
    tty: true
    stop_grace_period: 18s  # the driver parks the arm (11 s at most, #195) before disconnect() cuts the torque
    # Only container that builds (concurrent colcon on the same volume = conflicts).
    # viz waits for install/ to be ready.
    command: ["/opt/so101/entrypoint.sh"]

  # Second container of the brief (C-02). Builds only up to so101_perception, into its own
  # folders: two colcon builds on the same folders conflict (docs/project/02 §3.1).
  perception:
    build:
      context: ..
      dockerfile: docker/Dockerfile.perception
    image: tek5/perception
    init: true
    environment:
      <<: *ros-env
      USE_SIM: ${USE_SIM:-true}
    volumes:
      - ../ros2_ws:/ros2_ws
    networks: [rosnet]
    command: >
      bash -lc "source /opt/ros/jazzy/setup.bash && cd /ros2_ws &&
      colcon build --symlink-install --build-base build_perception --install-base install_perception
      --packages-up-to so101_perception &&
      source install_perception/setup.bash &&
      ros2 launch so101_perception perception.launch.py"

  # robot_state_publisher: publishes /robot_description and the TFs from
  # /joint_states (provided by your driver_node). Visualization is done
  # with RViz from the control container.
  viz:
    image: tek5/control
    init: true
    environment: *ros-env
    volumes:
      - ../ros2_ws:/ros2_ws
    networks: [rosnet]
    command: >
      bash -lc "source /opt/ros/jazzy/setup.bash &&
      until [ -f /ros2_ws/install/setup.bash ] && [ -f /ros2_ws/install/so101_description/share/so101_description/launch/viz.launch.py ]; do echo 'waiting for build (control)...'; sleep 1; done &&
      cd /ros2_ws && source install/setup.bash &&
      ros2 launch so101_description viz.launch.py"

networks:
  rosnet:
    driver: bridge
