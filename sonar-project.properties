# SonarQube Cloud (#61, docs/project/14 §4), run by the nightly on main. Exclusions as for ruff (pyproject.toml).
sonar.organization=foxaxewastaken
sonar.projectKey=FoxaxeWasTaken_Robotics
sonar.sources=ros2_ws/src,tools
sonar.tests=ros2_ws/src
sonar.test.inclusions=**/test/**
sonar.exclusions=**/test/**,**/setup.py,ros2_ws/src/so101_description/**,ros2_ws/src/example_py_pkg/**,ros2_ws/src/so101_brain/launch/brain.launch.py,ros2_ws/src/so101_driver/launch/driver.launch.py
sonar.python.version=3.12
sonar.python.coverage.reportPaths=coverage.xml
# Out of the coverage gate: tools/ (shell tests, no Python coverage) and launch files (run by launch tests, in
# processes coverage does not measure). setup.py (packaging) is out of the sources.
sonar.coverage.exclusions=tools/**,**/launch/**
